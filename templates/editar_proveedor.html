{% extends "base.html" %}

{% block title %}
Editar proveedor
{% endblock %}

{% block contenido %}

<h2 class="mb-4">
Editar proveedor
</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Nombre
</label>

<input
type="text"
name="nombre"
class="form-control"
value="{{ proveedor.nombre }}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Teléfono
</label>

<input
type="text"
name="telefono"
class="form-control"
value="{{ proveedor.telefono or '' }}">

</div>

<div class="mb-3">

<label class="form-label">
Correo
</label>

<input
type="email"
name="correo"
class="form-control"
value="{{ proveedor.correo or '' }}">

</div>

<div class="mb-3">

<label class="form-label">
Dirección
</label>

<textarea
name="direccion"
class="form-control">{{ proveedor.direccion or '' }}</textarea>

</div>

<button class="btn btn-primary">

Actualizar

</button>

<a
href="{{ url_for('proveedores') }}"
class="btn btn-secondary">

Cancelar

</a>

</form>

{% endblock %}
