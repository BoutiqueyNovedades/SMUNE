{% extends "base.html" %}

{% block title %}
Nuevo Proveedor
{% endblock %}

{% block contenido %}

<h2 class="mb-4">
    Nuevo Proveedor
</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label">
Nombre
</label>
<input
type="text"
name="nombre"
class="form-control"
required>
</div>

<div class="mb-3">
<label class="form-label">
Teléfono
</label>
<input
type="text"
name="telefono"
class="form-control">
</div>

<div class="mb-3">
<label class="form-label">
Correo
</label>
<input
type="email"
name="correo"
class="form-control">
</div>

<div class="mb-3">
<label class="form-label">
Dirección
</label>
<textarea
name="direccion"
class="form-control">
</textarea>
</div>

<button class="btn btn-success">
Guardar
</button>

<a
href="{{ url_for('proveedores') }}"
class="btn btn-secondary">
Cancelar
</a>

</form>

{% endblock %}
