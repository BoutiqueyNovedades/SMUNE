{% extends "base.html" %}

{% block title %}Nueva Unidad de Negocio{% endblock %}

{% block contenido %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        <i class="bi bi-building-add"></i>
        Nueva Unidad de Negocio
    </h2>

    <a href="{{ url_for('unidades_negocio') }}"
       class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>

        Regresar

    </a>

</div>

<form method="POST">

<div class="card shadow">

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Nombre *

</label>

<input
type="text"
class="form-control"
name="nombre"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Descripción

</label>

<input
type="text"
class="form-control"
name="descripcion">

</div>

</div>

<div class="form-check mb-4">

<input

class="form-check-input"

type="checkbox"

name="activo"

checked

id="activo">

<label

class="form-check-label"

for="activo">

Unidad activa

</label>

</div>

<hr>

<h5>

<i class="bi bi-grid"></i>

Módulos disponibles

</h5>

<p class="text-muted">

Seleccione los módulos que utilizará esta unidad.

</p>

<div class="row">

{% for modulo in modulos %}

<div class="col-md-4 mb-3">

<div class="card">

<div class="card-body">

<div class="form-check">

<input

class="form-check-input"

type="checkbox"

name="modulos"

value="{{ modulo.id }}"

checked

id="m{{ modulo.id }}">

<label

class="form-check-label"

for="m{{ modulo.id }}">

<strong>

{{ modulo.nombre }}

</strong>

<br>

<small>

{{ modulo.descripcion }}

</small>

</label>

</div>

</div>

</div>

</div>

{% endfor %}

</div>

<hr>

<button
class="btn btn-success">

<i class="bi bi-check-circle"></i>

Guardar Unidad

</button>

<a
href="{{ url_for('unidades_negocio') }}"
class="btn btn-outline-secondary">

Cancelar

</a>

</div>

</div>

</form>

{% endblock %}
