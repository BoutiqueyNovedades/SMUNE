{% extends "base.html" %}
{% block content %}
<h3 class="mt-3"><i class="bi bi-bell"></i> Alertas</h3>
<div class="mt-3">
{% for a in alertas %}
  <div class="alert alert-{{ a.color or 'info' }}"><strong>{{ a.titulo }}</strong> — {{ a.mensaje }}</div>
{% else %}
  <div class="alert alert-success">No hay alertas pendientes.</div>
{% endfor %}
</div>
{% endblock %}
