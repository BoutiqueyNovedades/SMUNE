{% extends 'base.html' %}

{% block title %}Nuevo Cliente - NuevaModa{% endblock %}

{% block contenido %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Nuevo Cliente</h2>
    <a href="{{ url_for('clientes') }}" class="btn btn-secondary">
        ← Volver a Clientes
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo *</label>
                <input class="form-control" 
                       type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Ej: Juan Pérez"
                       required
                       maxlength="150"
                       autofocus>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input class="form-control" 
                       type="tel"
                       id="telefono"
                       name="telefono"
                       placeholder="Ej: 55 1234 5678"
                       maxlength="30">
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input class="form-control" 
                       type="email"
                       id="correo"
                       name="correo"
                       placeholder="ejemplo@correo.com"
                       maxlength="120">
                <div class="form-text">Opcional. Se usará para enviar promociones.</div>
            </div>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-lg"></i> Guardar Cliente
            </button>
            <a href="{{ url_for('clientes') }}" class="btn btn-outline-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>

{% endblock %}
