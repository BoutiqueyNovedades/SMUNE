{% extends "base.html" %}
{% block content %}
<h3 class="mt-3"><i class="bi bi-arrow-left-right"></i> Movimiento de caja</h3>
<div class="card mt-3" style="max-width:480px"><div class="card-body">
  <p class="text-muted">Saldo actual: ${{ '%.2f'|format(caja.saldo_actual or 0) }}</p>
  <form method="post">
    <label class="form-label">Tipo</label>
    <select name="tipo" class="form-select mb-3">
      <option value="ENTRADA">Entrada</option>
      <option value="SALIDA">Salida</option>
    </select>
    <label class="form-label">Monto</label>
    <input type="number" step="0.01" min="0.01" name="monto" class="form-control mb-3" required>
    <label class="form-label">Observaciones</label>
    <input type="text" name="observaciones" class="form-control mb-3">
    <button class="btn btn-primary">Registrar</button>
    <a href="{{ url_for('caja') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div></div>
{% endblock %}
