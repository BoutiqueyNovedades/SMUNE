{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-key"></i>
                        Cambiar contraseña
                    </h4>

                </div>

                <div class="card-body">

                    {% if current_user.primer_acceso %}

                    <div class="alert alert-warning">

                        <strong>Primer acceso</strong><br>

                        Debe cambiar la contraseña temporal antes de continuar.

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Nueva contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password1"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Confirmar contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password2"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Guardar contraseña

                        </button>

                    </form>

                    {% else %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Contraseña actual

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="actual"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Nueva contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="nueva"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Confirmar contraseña

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="confirmar"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Cambiar contraseña

                        </button>

                    </form>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
