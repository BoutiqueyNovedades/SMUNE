{% extends "base.html" %}
{% block content %}
<h3 class="mt-3"><i class="bi bi-lock"></i> Corte de caja</h3>
<div class="card mt-3" style="max-width:480px"><div class="card-body">
  <p>Saldo inicial: <b>${{ '%.2f'|format(caja.fondo_inicial or 0) }}</b></p>
  <p>Efectivo esperado: <b>${{ '%.2f'|format(caja.saldo_actual or 0) }}</b></p>
  <div class="alert alert-warning small">Al cerrar, la jornada queda en solo lectura y se guarda en el historial.</div>
  <form method="post">
    <label class="form-label">Efectivo contado</label>
    <input type="number" step="0.01" min="0" name="efectivo_real" class="form-control mb-3" required>
    <button class="btn btn-danger">Realizar corte</button>
    <a href="{{ url_for('caja') }}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
</div></div>
{% endblock %}
