{% extends "base.html" %}

{% block contenido %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-success">

<h3 class="text-white">

Nuevo Usuario

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Nombre</label>

<input
class="form-control"
name="nombre"
required>

</div>

<div class="mb-3">

<label>Usuario</label>

<input
class="form-control"
name="usuario"
required>

</div>

<div class="mb-3">

<label>Contraseña Temporal</label>

<input
type="password"
class="form-control"
name="password"
required>

</div>

<div class="mb-3">

<label>Rol</label>

<select
class="form-select"
name="rol">

<option>ADMIN</option>

<option>GERENTE</option>

<option>CAJERO</option>

<option>VENDEDOR</option>

<option>COMPRAS</option>

<option>INVENTARIO</option>

</select>

</div>

<button
class="btn btn-success">

Guardar

</button>

</form>

</div>

</div>

</div>

{% endblock %}
