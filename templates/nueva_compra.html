{% extends "base.html" %}

{% block title %}
Nueva Compra
{% endblock %}

{% block contenido %}

<h2 class="mb-4">

Nueva Compra

</h2>

<form method="POST">

<div class="row mb-3">

    <div class="col-md-6">

        <label class="form-label">

            Unidad de negocio

        </label>

        <select
             id="unidad_negocio"
             name="unidad_negocio_id"
             class="form-control"
             required
             onchange="filtrarProductos()">

            <option value="">

                Seleccione

            </option>

            {% for unidad in unidades %}

            <option value="{{ unidad.id }}">

                {{ unidad.nombre }}

            </option>

            {% endfor %}

        </select>

    </div>

</div>

<div class="row">

<div class="col-md-6">

<label>

Proveedor

</label>

<select
class="form-control"
name="proveedor_id"
required>

<option value="">

Seleccione

</option>

{% for proveedor in proveedores %}

<option value="{{ proveedor.id }}">

{{ proveedor.nombre }}

</option>

{% endfor %}

</select>

</div>

</div>

<hr>

<h4>

Agregar producto

</h4>

<div class="row">

<div class="col-md-4">

<select
id="producto"
class="form-control">

<option value="">

Seleccione

</option>

{% for producto in productos %}

<option
value="{{ producto.id }}"
data-unidad="{{ producto.unidad_negocio_id }}"
data-nombre="{{ producto.nombre }}">

{{ producto.nombre }}

-

{{ producto.unidad_negocio.nombre }}

</option>


{% endfor %}

</select>

</div>

<div class="col-md-2">

<input
type="number"
id="cantidad"
class="form-control"
placeholder="Cantidad">

</div>

<div class="col-md-2">

<input
type="number"
step="0.01"
id="costo"
class="form-control"
placeholder="Costo">

</div>

<div class="col-md-2">

<button
type="button"
class="btn btn-success"
onclick="agregarProducto()">

Agregar

</button>

</div>

</div>

<hr>

<table
class="table table-bordered">

<thead>

<tr>

<th>

Producto

</th>

<th>

Cantidad

</th>

<th>

Costo

</th>

<th>

Subtotal

</th>

<th>

</th>

</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

<h3>

Total:

$

<span id="total">

0.00

</span>

</h3>

<input
type="hidden"
name="carrito"
id="carrito">

<button
type="submit"
class="btn btn-primary">

Guardar Compra

</button>

</form>

{% block scripts %}

<script>

let carrito=[];

let opcionesOriginales =
document.getElementById(
"producto"
).innerHTML;

function agregarProducto(){

    function filtrarProductos(){

if(carrito.length>0){

let continuar=confirm(

"Ya existen productos en la compra.\n\nCambiar la unidad vaciará el carrito.\n\n¿Desea continuar?"

);

if(!continuar){

document.getElementById(
"unidad_negocio"
).selectedIndex=0;

return;

}

carrito=[];

actualizarTabla();

}

let unidad=document.getElementById("unidad_negocio").value;
let select=document.getElementById("producto");

select.innerHTML=
opcionesOriginales;

if(unidad==""){

return;

}

for(let i=select.options.length-1;
i>=0;
i--){

let opcion=select.options[i];

if(opcion.value==""){

continue;

}

if(opcion.dataset.unidad!=unidad){

opcion.remove();

}

}

}
let select=document.getElementById("producto");
let id=parseInt(select.value);

if(!id){

alert("Seleccione un producto.");

return;

}

let nombre=select.options[select.selectedIndex].text;
let cantidad=parseInt(document.getElementById("cantidad").value);
let costo=parseFloat(document.getElementById("costo").value);

if(cantidad<=0||costo<=0){

return;

}

let subtotal=cantidad*costo;

carrito.push({
producto_id:id,
nombre:nombre,
cantidad:cantidad,
costo:costo,
subtotal:subtotal

});

actualizarTabla();

}

function eliminar(i){

carrito.splice(i,1);

actualizarTabla();

}

function actualizarTabla(){

let tabla=document.getElementById("tabla");

tabla.innerHTML="";

let total=0;

carrito.forEach((item,index)=>{

total+=item.subtotal;

tabla.innerHTML+=`

<tr>

<td>

${item.nombre}

</td>

<td>

${item.cantidad}

</td>

<td>

$${item.costo.toFixed(2)}

</td>

<td>

$${item.subtotal.toFixed(2)}

</td>

<td>

<button
type="button"
class="btn btn-danger btn-sm"
onclick="eliminar(${index})">

X

</button>

</td>

</tr>

`;

});

document.getElementById("total").innerHTML=total.toFixed(2);
document.getElementById("carrito").value=JSON.stringify(carrito);

}

</script>

{% endblock %}

{% endblock %}
