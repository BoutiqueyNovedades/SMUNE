{% extends "base.html" %}

{% block title %}
Iniciar sesión
{% endblock %}

{% block contenido %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Iniciar sesión
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST"
                          action="{{ url_for('login') }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Usuario
                            </label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control"
                                required
                                autocomplete="username"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                                autocomplete="current-password"
                            >

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-box-arrow-in-right"></i>

                                Iniciar sesión

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
